# ==========================================
# STUDENTHUB APPLICATION CONFIGURATION
# ==========================================

spring.application.name=studenthub


# ==========================================
# MYSQL DATABASE CONFIGURATION
# ==========================================

# Uses environment variables when configured.
# Defaults are for your existing local setup.

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/studenthub_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ==========================================
# JPA / HIBERNATE CONFIGURATION
# ==========================================

# Keep existing database tables unchanged.
spring.jpa.hibernate.ddl-auto=none

# SQL logging for local development.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Disable unnecessary open database sessions
# during web view rendering.
spring.jpa.open-in-view=false


# ==========================================
# SERVER CONFIGURATION
# ==========================================

server.port=8080